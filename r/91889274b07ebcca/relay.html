<!doctype html><meta charset="utf-8"><meta name="robots" content="noindex"><title>relay</title><body>
<script>
(async()=>{const f=location.hash.slice(1);try{const r=await fetch(f);const b=await r.arrayBuffer();(window.opener||parent).postMessage({relay:1,name:f.split('/').pop(),buf:b,status:r.status},'*');document.body.textContent='sent '+b.byteLength;}catch(e){(window.opener||parent).postMessage({relay:1,error:String(e)},'*')}setTimeout(()=>window.close(),800)})();
</script></body>
